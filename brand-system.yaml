brand_system:
  meta:
    name: "Ball Lightning AB — Shared Brand System"
    version: 0.1 (wip, to be replaced by "brand-design-system.yaml" and "brand-architecture.yaml")
    repo: "https://github.com/BallLightningAB/brand-system"
    purpose: >-
      Shared design + cross-brand policies for Ball Lightning, The Builder Coil, and Chronomation.
      Open patterns; protected trademarks/assets.

  precedence:
    baseline: "This file is the baseline."
    overlays:
      optional_visual_refresh:
        file: "optional-visual-refresh.yaml"
        status: "optional"
        rule: >-
          Overlay is opt-in per project. If it contradicts baseline, baseline wins unless explicitly enabled.

  cross_brand_policies:
    newsletter:
      name: "The Upkeep"
      canonical_home: "The Builder Coil"
      rules:
        - "Only The Builder Coil owns signup + subscriber storage."
        - "Ball Lightning must not store subscriber PII or maintain its own list."
        - "Ball Lightning may show a CTA that links to TBC signup."
    content_syndication:
      rules:
        - "Canonical blog/news publishing lives on The Builder Coil."
        - "Other sites may embed preview cards (teasers) that link to canonical TBC URLs."
        - "Avoid full-content duplication to reduce SEO cannibalization."
      freshness:
        preferred: "Public feed/endpoint from TBC (implementation up to consuming repos)."

  # MOVED FROM pdd-thebuildercoil.yaml: pdd.email_architecture
  email_architecture:
    provider: resend
    account:
      team_scope: "Ball Lightning / Chronomation"
      plan:
        name: "Free"
        limitation:
          max_sending_domains: 1
    strategy:
      option_1_single_domain:
        label: "Chronomation-owned sending domain"
        status: "active"
        description: >-
          Use a single Chronomation-owned domain as the only verified sending
          domain in Resend. All brands/tenants send via this domain using
          different From-names and mailboxes.
        sending_domain: "updates.chronomation.com"
        return_path_prefix: "outbound"
        mailboxes:
          the_builder_coil_upkeep:
            from_address: "theupkeep@updates.chronomation.com"
            display_name: "The Builder Coil — The Upkeep"
            purpose: "Primary newsletter for The Builder Coil"
          chronomation_system:
            from_address: "system@updates.chronomation.com"
            display_name: "Chronomation — System Notifications"
            purpose: "App/system alerts (future)"
          chronomation_marketing:
            from_address: "hello@updates.chronomation.com"
            display_name: "Chronomation"
            purpose: "Marketing / onboarding flows (future)"
        data_model:
          sending_domains_table:
            - id: "chronomation_default"
              domain: "updates.chronomation.com"
              is_default: true
          brands_table_example:
            - id: "tbc"
              name: "The Builder Coil"
              default_from: "theupkeep@updates.chronomation.com"
              display_name: "The Builder Coil — The Upkeep"
              sending_domain_id: "chronomation_default"
            - id: "chronomation"
              name: "Chronomation"
              default_from: "hello@updates.chronomation.com"
              display_name: "Chronomation"
              sending_domain_id: "chronomation_default"
      option_2_tenant_owned_resend:
        label: "Tenant-resident Resend account"
        status: "planned"
        position: "advanced"
        description: >-
          Advanced mode for customers who either (a) already use Resend or
          (b) pay Chronomation for admin/hosting. Each tenant can connect its
          own Resend API key and verified domain. Chronomation becomes an ESP-
          agnostic orchestration layer.
        target_users:
          - "Advanced users comfortable managing DNS + ESP setup"
          - "Managed customers where Chronomation handles infra/admin"
        requirements:
          tenant_must:
            - "Create or own a Resend account"
            - "Verify their own sending domain (e.g. updates.customer.com)"
            - "Provide a Resend API key with send + domain read permissions"
          chronomation_must:
            - "Store tenant Resend credentials securely (per-tenant secrets)"
            - "Allow selecting `delivery_provider = tenant_resend` at workspace level"
            - "Allow mapping tenant brands → tenant sending domain / From-addresses"
        ui_notes:
          - "Mark as 'Advanced setup' in workspace email settings."
          - "Wizard: 1) explain model, 2) ask for API key, 3) fetch domains, 4) let user pick default domain."

    implementation_notes:
      - "Keep internal schema provider-agnostic (e.g. `delivery_providers` table with `type = resend`)."
      - "All outbound mail for now uses `chronomation_default` sending_domain."
      - "The Upkeep is first real-world tenant using Option 1; instrument tracking and event logging for it first."
      - "When enabling Option 2, re-use same abstraction for campaigns/flows; only the delivery provider + sending_domain change per workspace."

    future_sale_considerations:
      - "If Chronomation is sold, the chronomation_resend account (or equivalent config) can be handed to the buyer independently of Ball Lightning's Resend account."
      - "If TBC is sold separately, export The Upkeep subscribers and templates and let the buyer import them into their own ESP."

  # MOVED FROM pdd-thebuildercoil.yaml: pdd.design
design:
  shared:
    typography:
      primary:
        family: "Big Shoulders Variable"
        css_var: "--font-primary"
        stack: '"Big Shoulders", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
        axes:
          wght: "100..900"
      weights:
        title: 900   # page/brand titles
        h1: 700
        h2: 500
        h3: 500
        body: 400
        ui: 400
      casing:
        headings: "optional uppercase (recommended for Big Shoulders look)"
        body: "sentence case"
      base:
        html_font_size_px: 16
        body:
          size_rem: 1.0
          line_height: 1.5
          max_width_ch: 70
      scale:
        ratio: 1.25
        note: "Use the existing 1.25 scale from optional-visual-refresh as reference."
      code_blocks:
        recommended_exception:
          note: "Keep monospace for code blocks for readability (even if brand copy is Big Shoulders)."
          mono_stack: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace'
      backgrounds:
        dark_base: "#05070A"
        dark_elevated: "#0A1014"
        dark_subtle: "#111827"
        light_base: "#F5E6D3"
        light_elevated: "#F9F3E8"
      shared_colors:
        cream_main: "#F5E6D3"
        cream_soft: "#F9F3E8"
        dark_ink: "#111827"
        light_ink: "#F9FAFB"
        body_on_dark: "#E5E7EB"
        muted_on_dark: "#9CA3AF"

    brands:
      # Keep the existing per-brand schemes from pdd-thebuildercoil.yaml here (verbatim).
      # NOTE: optional-visual-refresh.yaml proposes changes (e.g., JetBrains Mono for everything,
      # Chronomation palette adjustments); treat those as opt-in overlay.
      the_builder_coil: {}
      chronomation: {}
      ball_lightning: {}
