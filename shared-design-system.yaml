brand_system:
  meta:
    name: "Ball Lightning AB — Shared Brand System"
    code_name: "shared-design-system"
    version: "0.1"
    repo: "https://github.com/BallLightningAB/brand-system"
    purpose: >-
      Shared design + cross-brand policies for Ball Lightning, The Builder Coil, and Chronomation.
      Open patterns; protected trademarks/assets.
      It's used in conjunction with the project-specific PDDs, the https://github.com/BallLightningAB/brand-system/shared-ecosystem-pdd.yaml and
      the https://github.com/BallLightningAB/brand-system/shared-architecture.yaml documents
      that define the shared architecture, system policies and design system.

  precedence:
    baseline: "This file is the baseline."
    overlays:
      optional_visual_refresh:
        file: "specs/current-changes/optional-visual-refresh.yaml"
        status: "optional"
        rule: >-
          Overlay is opt-in per project. If it contradicts baseline, baseline wins unless explicitly enabled.

  cross_brand_policies:
    newsletter:
      name: "The Upkeep"
      canonical_home: "The Builder Coil"
      rules:
        - "Only The Builder Coil owns signup + subscriber storage."
        - "Ball Lightning must not store subscriber PII or maintain its own list."
        - "Ball Lightning may show a CTA that links to TBC signup."
    content_syndication:
      rules:
        - "Canonical blog/news publishing lives on The Builder Coil."
        - "Other sites may embed preview cards (teasers) that link to canonical TBC URLs."
        - "Avoid full-content duplication to reduce SEO cannibalization."
      freshness:
        preferred: "Public feed/endpoint from TBC (implementation up to consuming repos)."

  design:
    shared:
      typography:
        primary:
          family: "Big Shoulders Variable"
          css_var: "--font-primary"
          stack: '"Big Shoulders", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
          axes:
            wght: "100..900"
        alternatives:
          jetbrains_mono:
            family: "JetBrains Mono"
            css_var: "--font-jetbrains"
            stack: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace'
            body_weight: 400
            heading_weight: 500
            usage: "Primary for TBC/Chronomation devlog aesthetic; alternative for other brands"
          montserrat_lora:
            sans_stack: "Montserrat, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            serif_stack: "Lora, 'Times New Roman', ui-serif, Georgia, serif"
            mono_stack: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace'
            usage:
              headings: "Lora for H1–H2 (tome / grimoire feeling), Montserrat for H3+"
              body: "Montserrat for paragraphs, lists, UI copy"
              code: "JetBrains Mono for code, IDs, commit snippets"
        weights:
          title: 900   # page/brand titles
          h1: 700
          h2: 500
          h3: 500
          body: 400
          ui: 400
        casing:
          headings: "optional uppercase (recommended for Big Shoulders look)"
          body: "sentence case"
        base:
          html_font_size_px: 16
          body:
            size_rem: 1.0
            line_height: 1.5
            letter_spacing: 0em
            max_width_ch: 70
        scale:
          ratio: 1.25
          steps:
            p:
              role: "body"
              px: 16
              rem: 1.00
            h6:
              role: "eyebrow / small heading"
              px: 20
              rem: 1.25
            h5:
              role: "section label / small title"
              px: 25
              rem: 1.5625
            h4:
              role: "card / block title"
              px: 31.25
              rem: 1.9531
            h3:
              role: "sub-page title"
              px: 39.06
              rem: 2.4414
            h2:
              role: "page title"
              px: 48.83
              rem: 3.0518
            h1:
              role: "hero / main title"
              px: 61.04
              rem: 3.8147
        letter_spacing:
          # negative tracking only on uppercase / large headings
          p: 0em
          small: 0.01em        # badges, overlines
          h6: -0.005em         # -0.5%
          h5: -0.0075em
          h4: -0.010em
          h3: -0.015em         # -1.5%
          h2: -0.018em
          h1: -0.020em         # -2%
        line_height:
          p: 1.5      # 150%
          h6: 1.35
          h5: 1.3
          h4: 1.25    # ~130%
          h3: 1.2
          h2: 1.1     # ~110%
          h1: 1.0     # 100%
        tailwind_mappings:
          body:
            base: "text-[1rem] leading-[1.5]"
            longform_alt: "text-[0.9375rem] leading-[1.6]"    # ~15px body for dense docs
          headings_jetbrains_mono:
            h1: "text-[clamp(2.8rem,4vw,3.8rem)] leading-[1.0] font-medium tracking-[-0.02em]"
            h2: "text-[clamp(2.1rem,3vw,3.05rem)] leading-[1.1] font-medium tracking-[-0.018em]"
            h3: "text-[2.44rem] leading-[1.2] font-medium tracking-[-0.015em]"
            h4: "text-[1.95rem] leading-[1.25] font-medium tracking-[-0.01em]"
            h5: "text-[1.5625rem] leading-[1.3] font-medium tracking-[-0.0075em]"
            h6: "text-[1.25rem] leading-[1.35] font-medium tracking-[-0.005em] uppercase"
          headings_big_shoulders:
            h1: "text-[clamp(3rem,4.5vw,3.8rem)] leading-[1.0] font-medium tracking-[-0.015em] uppercase"
            h2: "text-[clamp(2.3rem,3.5vw,3.05rem)] leading-[1.05] font-medium tracking-[-0.013em] uppercase"
            h3: "text-[2.44rem] leading-[1.1] font-medium tracking-[-0.012em] uppercase"
            h4: "text-[1.95rem] leading-[1.15] font-medium tracking-[-0.01em] uppercase"
            h5: "text-[1.5625rem] leading-[1.2] font-medium tracking-[-0.008em] uppercase"
            h6: "text-[1.25rem] leading-[1.25] font-medium tracking-[-0.005em] uppercase"
        code_blocks:
          mono_stack: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace'
        backgrounds:
          dark_base: "#05070A"
          dark_elevated: "#0A1014"
          dark_subtle: "#111827"
          light_base: "#F5E6D3"
          light_elevated: "#F9F3E8"
          pattern:
            description: >-
              Radial gradient from top with subtle brand colors plus grid/carbon
              overlay. Same pattern family reused on heroes, tiles and hover states.
            css_example: |
              background:
                radial-gradient(circle at top, #251842 0, #05070a 55%, #020308 100%),
                repeating-linear-gradient(
                  to right,
                  rgba(255,255,255,0.04) 0,
                  rgba(255,255,255,0.04) 1px,
                  transparent 1px,
                  transparent 32px
                ),
                repeating-linear-gradient(
                  to bottom,
                  rgba(255,255,255,0.04) 0,
                  rgba(255,255,255,0.04) 1px,
                  transparent 1px,
                  transparent 32px
                );
              background-blend-mode: soft-light, normal, normal;
        shared_colors:
          cream_main: "#F5E6D3"
          cream_soft: "#F9F3E8"
          dark_ink: "#111827"
          light_ink: "#F9FAFB"
          body_on_dark: "#E5E7EB"
          muted_on_dark: "#9CA3AF"

      color_schemes:
        thebuildercoil:
          description: >
            Arcane engineering / builder’s grimoire. Dark void background with cream
            ink and selective teal/violet energy as accents. Feels like a spellbook
            for modern dev work, but still readable and practical.
          scheme:
            dark:
              background:
                base: "#05070A"
                elevated: "#0A1014"
                subtle: "#111827"
              foreground:
                body: "#E5E7EB"
                muted: "#9CA3AF"
                heading_cream: "#F5E6D3"   # H1/H2, key labels, nav brand text
              logo:
                ink: "#F5E6D3"             # circle, coil, book in dark mode
              surfaces:
                card_default: "#0A1014"
                card_border_cream: "#F5E6D3"
                tag_bg_cream_soft: "rgba(245,230,211,0.06)"
                tag_text_cream: "#F5E6D3"
              primaries:
                teal: "#23F0FF"            # electric teal highlights
                teal_hover: "#4FF6FF"
                teal_soft: "rgba(35,240,255,0.18)"
                violet: "#8B5CFF"          # arcane violet accents
                violet_hover: "#A78BFA"
                violet_soft: "rgba(139,92,255,0.16)"
              gradient:
                name: "tbc-primary"
                colors: ["#8B5CFF", "#00BFFF"]
                css: "linear-gradient(135deg, #8B5CFF, #00BFFF)"
              semantic_tokens:
                brand_accent_1: "#8B5CFF"
                brand_accent_2: "#00BFFF"
                brand_gradient: "var(--tbc-primary)"
                brand_tag_bg: "rgba(139,92,255,0.16)"
                brand_tag_text: "#F5E6D3"
              accent:
                ember: "#FFDCA8"           # warm highlight tying into cream
                success: "#4ADE80"
                warning: "#FBBF24"
                danger: "#F97373"
              neutrals:
                border_subtle: "rgba(148,163,184,0.35)"
                border_strong: "rgba(148,163,184,0.6)"
            light:
              background:
                base: "#F5E6D3"            # cream base
                elevated: "#F9F3E8"
              foreground:
                primary: "#111827"
                muted: "#4B5563"
                heading_ink: "#111827"
              logo:
                ink: "#111827"             # circle, coil, book in light mode
              primaries:
                teal: "#23F0FF"
                violet: "#8B5CFF"
              accent:
                ember: "#C05621"           # slightly darker ember for text/icons
                success: "#15803D"
                warning: "#B45309"
                danger: "#B91C1C"

        chronomation:
          description: >
            Automation engine / control center. Same void/cream foundations, but
            calmer teal/blue accents and a more utilitarian SaaS feel. Feels like a
            reliable control room for orchestrating workflows behind the scenes.
          scheme:
            dark:
              background:
                base: "#05070A"
                elevated: "#0A1014"
                subtle: "#111827"
              foreground:
                body: "#E5E7EB"
                muted: "#9CA3AF"
                heading_cream: "#F5E6D3"   # headings, key status labels
              logo:
                ink: "#F5E6D3"             # Chronomation mark on dark
              surfaces:
                card_default: "#0A1014"
                card_border_cream: "#F5E6D3"
                tag_bg_cream_soft: "rgba(245,230,211,0.06)"
              primaries:
                teal: "#12B8C4"            # calmer teal than TBC
                teal_hover: "#22D3EE"
                teal_soft: "rgba(34,211,238,0.18)"
                sky: "#38BDF8"
                sky_hover: "#60A5FA"
              gradient:
                name: "chrono-primary"
                colors: ["#00BFFF", "#F81EA6"]  # blue + pink
                css: "linear-gradient(135deg, #00BFFF, #F81EA6)"
              semantic_tokens:
                brand_accent_1: "#00BFFF"       # primary Chronomation blue
                brand_accent_2: "#F81EA6"       # signature Chronomation pink
                brand_gradient: "var(--chrono-primary)"
                brand_tag_bg: "rgba(0,191,255,0.16)"
                brand_tag_text: "#F5E6D3"
              accent:
                action: "#FACC15"          # sharp yellow CTAs
                success: "#22C55E"
                warning: "#EAB308"
                danger: "#F97373"
              neutrals:
                border_subtle: "rgba(148,163,184,0.30)"
                border_strong: "rgba(148,163,184,0.55)"
            light:
              background:
                base: "#F5E6D3"
                elevated: "#F9F3E8"
              foreground:
                primary: "#111827"
                muted: "#4B5563"
              logo:
                ink: "#111827"
              primaries:
                teal: "#12B8C4"
                sky: "#38BDF8"

        balllightning:
          description: >
            Parent brand. Shares the same dark/cream foundations but switches to
            molten red/orange energy with a slightly more aggressive, playful feel.
            Represents the studio behind Chronomation and The Builder Coil.
          scheme:
            dark:
              background:
                base: "#05070A"
                elevated: "#0A1014"
                subtle: "#111827"
              foreground:
                body: "#E5E7EB"
                muted: "#9CA3AF"
                heading_cream: "#F5E6D3"   # headings and key brand marks
              logo:
                ink: "#F5E6D3"             # BL wordmark / icon on dark
              surfaces:
                card_default: "#0A1014"
                card_border_cream: "#F5E6D3"
                tag_bg_cream_soft: "rgba(245,230,211,0.06)"
              primaries:
                deep_molten: "#9C1B12"
                mid_red: "#DD3A28"
              gradient:
                name: "bl-primary"
                colors: ["#DD3A28", "#FF7268"]
                css: "linear-gradient(135deg, #DD3A28, #FF7268)"
              semantic_tokens:
                brand_accent_1: "#DD3A28"
                brand_accent_2: "#FF7268"
                brand_gradient: "var(--bl-primary)"
                brand_tag_bg: "rgba(221,58,40,0.16)"
                brand_tag_text: "#F5E6D3"
              accent:
                warm_rose: "#FF7268"
                pale_ember: "#FFD4C9"
              neutrals:
                surface: "#1B181C"
                soft_light: "#E8E5E6"
            light:
              background:
                base: "#F5E6D3"
                elevated: "#F9F3E8"
              foreground:
                primary: "#111827"
                muted: "#4B5563"
              logo:
                ink: "#111827"
              primaries:
                deep_molten: "#9C1B12"
                mid_red: "#DD3A28"
              accent:
                warm_rose: "#FF7268"
                pale_ember: "#FFD4C9"

          relationship_notes:
            - "Chronomation and TBC share the same typography and core component language as Ball Lightning."
            - "TBC leans into teal/violet arcane; Chronomation leans into teal/blue lab; Ball Lightning leans into molten red/orange."
            - "It should feel like one universe: same fonts and component shapes, different color temperatures and attitude."

      layout_patterns:
        hero:
          description: >-
            Two-column hero inspired by factory.ai. Left column content, right
            column animated brand tile. Same pattern used across all three brands.
          desktop_grid: "grid-cols-[minmax(0,1.1fr)_minmax(0,0.9fr)] gap-10-12"
          mobile_behavior: "Stack columns; text first, tile second."
          left_column:
            contents:
              - "Kicker pill (e.g. 'Building in public')."
              - "H1 and optional supporting subheadline."
              - "Short paragraph."
              - "Two CTAs: primary (filled gradient), secondary (outlined/ghost)."
          right_column:
            tile:
              base_style:
                background: "brand_gradient"
                pattern: "same grid/carbon pattern, slightly stronger than page bg"
                radius: "rounded-3xl"
                shadow: "0 20px 60px rgba(0,0,0,0.9)"
              animation_ideas:
                - "Looping CSS gradient shift within the tile."
                - "Simple SVG line/shape animation in brand accents."
              hover_behavior:
                - "Subtle increase in glow and contrast of gradient."
                - "Slow movement of grid pattern (background-position animation)."

        blog_news_block:
          description: >-
            Blog/news sections mimic factory.ai/news: clean card grid with subtle
            borders, pattern on hover, and brand-colored interactions.
          note: "TBC uses this pattern; other brands may opt out or adapt."
          structure:
            header:
              elements:
                - "Section title (e.g. 'Latest from the Coil')."
                - "Right-aligned 'View all posts' link."
            grid:
              columns: "2–3 responsive columns depending on viewport."
          card_style:
            base:
              background: "rgba(5,7,10,0.95)"
              border: "1px solid rgba(255,255,255,0.06)"
              radius: "rounded-2xl"
              shadow: "0 20px 60px rgba(0,0,0,0.9)"
            hover:
              transform: "translateY(-2px)"
              border: "border-image using brand_gradient"
              pattern: "grid/carbon overlay slightly stronger and moving"
              title_effect: "underline in brand accent color"
            content_elements:
              - "Tag pills with brand accent background."
              - "Post title."
              - "Meta (date, reading time)."
              - "Short excerpt."

      layout_guidelines:
        vertical_rhythm:
          base_unit_px: 4        # multiples of 4px or 8px for spacing
          stack_spacing:
            paragraph_gap: 0.75rem      # ~12px between paragraphs
            paragraph_to_h2: 1.5rem     # more space above headings than below
            card_title_to_body: 0.5rem
        hierarchy_patterns:
          hero_title:
            h1: true
            supporting_text: "max-w-[45ch] text-[1rem] md:text-[1.0625rem]"
            cta_stack: "gap-4 md:gap-6"
          section_title:
            element: "h2 or h3"
            spacing_top: "mt-12 md:mt-16"
            spacing_bottom: "mb-4 md:mb-6"
            underline_or_label: "optional h6 / eyebrow in brand accent"

      component_guidelines:
        theme_tokens:
          notes: >-
            Existing YAML token files stay as the single source of truth. Each
            brand should have a small set of semantic tokens:
          semantic_tokens:
            - "--brand-accent-1"
            - "--brand-accent-2"
            - "--brand-gradient"
            - "--brand-tag-bg"
            - "--brand-tag-text"
          mapping: >-
            For each site, set these tokens at the layout root via CSS variables and
            wire them into Tailwind/Shadcn theme config.

        shadcn_components:
          shared_changes:
            button:
              variants:
                primary: "Uses brand-gradient background with described hover."
                secondary: "Transparent dark background, gradient border on hover."
            card:
              style: "Dark panel with subtle border and pattern-hover behavior."
            badge_tag:
              style: "Brand-colored pills for labels and post tags."
            navbar:
              active_state: "Underline in brand gradient; text in brand accent."
              hover_state: "Accent underline plus color shift."

        buttons_and_links:
          primary_button:
            base:
              background: "brand_gradient"
              text_color: "#05070A or #0A1014 depending on contrast"
              border: "transparent or subtle"
              shadow: "soft glow matching gradient"
            hover:
              effects:
                - "Increase gradient contrast slightly."
                - "Add low-opacity animated grid overlay."
                - "Slight lift (translateY)."
          secondary_button:
            base:
              background: "transparent dark"
              border: "1px solid rgba(255,255,255,0.12)"
            hover:
              effects:
                - "Border becomes brand_gradient (border-image or pseudo-element)."
                - "Slight lift and mild glow."
          text_links:
            default:
              color: "body text color"
              underline: "none"
            hover:
              color: "brand_accent_1 or brand_accent_2"
              underline: "visible, in brand accent color"
              motion: "optional 1–2px upward movement"